---
- name: 'СЦЕНАРИЙ 3: Обновление системы'
  hosts: localhost
  connection: local
  become: yes
  gather_facts: yes

  tasks:
    - name: 'Обновление кэша и пакетов'
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: update_result

    - name: 'Проверка необходимости перезагрузки'
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: 'Предупреждение о перезагрузке (пропускаем для localhost)'
      debug:
        msg: |
          ⚠️  ВНИМАНИЕ: Перезагрузка требуется, но пропущена для localhost
          📋 Чтобы перезагрузить систему, выполните вручную: sudo reboot
      when: reboot_required.stat.exists

    - name: 'Результат обновления'
      debug:
        msg: |
          ===================================
          📊 ОТЧЕТ ОБ ОБНОВЛЕНИИ
          ===================================
          🖥️  Сервер: {{ ansible_hostname }}
          📦 Пакеты обновлены: {{ 'Да' if update_result.changed else 'Нет' }}
          🔄 Перезагрузка требуется: {{ 'Да' if reboot_required.stat.exists else 'Нет' }}
          ===================================
