---
- name: 'СЦЕНАРИЙ 3: Обновление системы с перезагрузкой'
  hosts: all
  become: yes
  serial: 1  # Обновляем серверы по очереди

  tasks:
    # Обновление кэша
    - name: '3.1 - Обновление кэша пакетов'
      apt:
        update_cache: yes
      tags: [update]

    # Обновление всех пакетов
    - name: '3.2 - Обновление всех пакетов (dist-upgrade)'
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: apt_result
      tags: [upgrade]

    # Проверка необходимости перезагрузки
    - name: '3.3 - Проверка необходимости перезагрузки'
      stat:
        path: /var/run/reboot-required
      register: reboot_required
      tags: [reboot]

    # Перезагрузка сервера
    - name: '3.4 - Перезагрузка сервера'
      reboot:
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
        msg: "Автоматическая перезагрузка после обновления системы (Ansible)"
      when: reboot_required.stat.exists
      tags: [reboot]

    # Ожидание после перезагрузки
    - name: '3.5 - Ожидание доступности сервера'
      wait_for_connection:
        delay: 10
        timeout: 300
      when: reboot_required.stat.exists
      tags: [reboot]

    # Отчет об обновлении
    - name: '3.6 - Отчет о результатах обновления'
      debug:
        msg: |
          ===================================
          📊 ОТЧЕТ ОБ ОБНОВЛЕНИИ
          ===================================
          🖥️  Сервер: {{ ansible_hostname }}
          📦 Обновления: {{ apt_result.results | length if apt_result.results else 0 }}
          🔄 Перезагрузка: {{ 'Да' if reboot_required.stat.exists else 'Нет' }}
          ===================================
      tags: [info]