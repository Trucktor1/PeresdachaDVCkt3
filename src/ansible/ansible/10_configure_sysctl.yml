---
- name: 'СЦЕНАРИЙ 10: Настройка системных параметров (sysctl)'
  hosts: all
  become: yes

  vars:
    sysctl_optimizations:
      # Общие оптимизации
      - { name: 'net.core.somaxconn', value: '1024', comment: 'Максимальное количество ожидающих соединений' }
      - { name: 'net.core.netdev_max_backlog', value: '5000', comment: 'Размер очереди пакетов' }
      - { name: 'net.ipv4.tcp_max_syn_backlog', value: '4096', comment: 'Очередь SYN пакетов' }

      # Безопасность
      - { name: 'net.ipv4.tcp_syncookies', value: '1', comment: 'Защита от SYN flood' }
      - { name: 'net.ipv4.conf.all.rp_filter', value: '1', comment: 'Reverse path filtering' }
      - { name: 'net.ipv4.conf.default.rp_filter', value: '1', comment: 'Reverse path filtering default' }
      - { name: 'net.ipv4.icmp_echo_ignore_all', value: '0', comment: 'Ответ на ICMP запросы' }

      # Оптимизация памяти
      - { name: 'vm.swappiness', value: '10', comment: 'Использование swap (меньше = лучше производительность)' }
      - { name: 'vm.vfs_cache_pressure', value: '50', comment: 'Склонность к кешированию inode/dentry' }
      - { name: 'vm.dirty_ratio', value: '30', comment: 'Максимальный процент грязных страниц' }

      # Сетевые оптимизации
      - { name: 'net.ipv4.ip_local_port_range', value: '1024 65535', comment: 'Диапазон локальных портов' }
      - { name: 'net.ipv4.tcp_tw_reuse', value: '1', comment: 'Переиспользование TIME-WAIT сокетов' }
      - { name: 'net.ipv4.tcp_fin_timeout', value: '30', comment: 'Таймаут для FIN-WAIT-2' }
      - { name: 'net.ipv4.tcp_keepalive_time', value: '600', comment: 'Время до отправки keepalive' }

  tasks:
    # Применение sysctl параметров
    - name: '10.1 - Применение sysctl параметров'
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_set: yes
      loop: "{{ sysctl_optimizations }}"
      register: sysctl_results
      tags: [apply]

    # Создание файла с комментариями
    - name: '10.2 - Создание файла /etc/sysctl.d/99-custom.conf'
      copy:
        content: |
          # Custom sysctl settings applied by Ansible
          # Date: {{ ansible_date_time.date }}
          # Host: {{ ansible_hostname }}
          {% for item in sysctl_optimizations %}
          # {{ item.comment }}
          {{ item.name }} = {{ item.value }}
          {% endfor %}
        dest: /etc/sysctl.d/99-custom.conf
        mode: '0644'
        owner: root
        group: root
      tags: [config]

    # Проверка примененных параметров
    - name: '10.3 - Проверка ключевых параметров'
      command: "sysctl -n {{ item.name }}"
      loop: "{{ sysctl_optimizations }}"
      register: sysctl_check
      changed_when: false
      tags: [verify]

    # Вывод результатов
    - name: '10.4 - Результаты настройки sysctl'
      debug:
        msg: |
          ===================================
          ⚙️ SYSCTL НАСТРОЙКИ
          ===================================
          {% for item in sysctl_optimizations[:5] %}
          📌 {{ item.name }} = {{ item.value }} ({{ item.comment }})
          {% endfor %}
          📊 Всего параметров: {{ sysctl_optimizations | length }}
          ===================================
      tags: [info]

  handlers:
    - name: reload sysctl
      command: sysctl --system