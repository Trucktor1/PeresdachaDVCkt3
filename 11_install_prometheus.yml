---
- name: 'СЦЕНАРИЙ 11: Установка Prometheus'
  hosts: localhost
  connection: local
  become: yes

  tasks:
    - name: 'Скачивание Prometheus'
      get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz
        dest: /tmp/prometheus.tar.gz

    - name: 'Распаковка'
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp/
        remote_src: yes
        creates: /tmp/prometheus-2.45.0.linux-amd64

    - name: 'Копирование бинарных файлов'
      copy:
        src: "/tmp/prometheus-2.45.0.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
        remote_src: yes
      loop:
        - prometheus
        - promtool

    - name: 'Информация'
      debug:
        msg: |
          ✅ Prometheus установлен!
          🌐 Веб-интерфейс: http://localhost:9090
